<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn a plain-English prompt into an accurate, production-grade system-architecture diagram." />
    <title>ArchForge — accurate system architecture from a prompt</title>
    <script>
      // Apply the saved theme before paint to avoid a flash. Dark is the default.
      try {
        const t = localStorage.getItem('archforge-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
